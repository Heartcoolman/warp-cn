name: Auto-attach build artifacts to draft release

# 监听 build-mac-app.yml 成功完成事件，把构建产物挂到同 tag 的 draft release 上。
#
# 这样一来：
#   1) 创建 draft release（tag 名 = 本次发版 tag）
#   2) 触发 build-mac-app（tag 触发时 run 的 head_branch 就是 tag 名）
#   3) 构建完成后这个工作流自动把 artifact 落到那个 draft 上
#   4) 资产齐了自动 publish；不齐则保持 draft 等人工介入
#
# 历史教训（四个坑，全部踩过并已修）：
#   1. 旧版要求 `target_commitish == head_sha`。但 release 的 target_commitish
#      存的是**分支名**（master），不是 SHA；而 tag 触发构建的 head_branch 是
#      tag 名。两者永远不相等 → tag 发版时这个 workflow 从来没生效过。
#      现在按「tag 名」匹配：release.tag_name == run.head_branch。
#   2. 旧版用 `/releases/tags/<tag>` 读资产清单。该端点对 draft 一律 404，
#      于是「缺不缺资产」永远判定为全缺，auto-publish 从不触发
#      （2026-08-08 日志里就有 `gh: Not Found (HTTP 404)`）。
#      GitHub 对 draft 没有 by-tag 端点 → 全程改用 `/releases/<id>`。
#   3. 旧版放行条件是写死的 4 个资产，其中含 debug profile 的 app/dmg。
#      日常只出 release 包，debug 资产永远不会出现 → draft 被永久卡死
#      （v0.2026.08.25-cn.0 就这样卡了两个月，最后只能手删）。
#      现在按「实际该有的东西」判定：至少一份 macOS 产物 + 每个 tar.gz 配
#      minisig。
#   4. 旧版只找 draft。Linux/Windows 的 tag 构建会抢先 `gh release create`
#      出一个已发布的 release，导致 mac 资产永远挂不上
#      （v0.2026.10.18 少 4 个资产就是这么来的）。现在已发布 release 也会
#      回填。

on:
  workflow_run:
    workflows: ["Build Mac App (unsigned)"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-attach-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  attach:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Find release matching build ref
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: ${{ github.event.workflow_run.head_branch }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          if [ -z "$BUILD_REF" ]; then
            echo "::notice::Build run has no head_branch — skipping attach"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 按 tag 名匹配（见文件头「历史教训 1」）。同 tag 若有多条（历史上
          # 重跑过），draft 优先、其次最新创建的那条。
          row=$(gh api "/repos/${{ github.repository }}/releases?per_page=100" \
                | jq -r --arg ref "$BUILD_REF" '
                    [ .[]
                      | select(.tag_name == $ref)
                      | select(.tag_name | startswith("zz-") | not)
                    ]
                    | sort_by([(.draft | if . then 1 else 0 end), .created_at])
                    | last
                    | [(.id // ""), (.tag_name // ""), (.draft | tostring)] | @tsv
                  ')
          id=$(echo "$row" | cut -f1)
          tag=$(echo "$row" | cut -f2)
          is_draft=$(echo "$row" | cut -f3)
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::notice::No release with tag $BUILD_REF (sha $BUILD_SHA) — skipping attach"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "id=$id"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if [ "$is_draft" = "true" ]; then
            echo "::notice::Will attach artifacts to draft release $tag (id $id)"
          else
            # 已发布的 release 也要回填：Linux/Windows 先 create 的情况下，
            # mac 产物只有靠这里才能补上。
            echo "::notice::Will attach artifacts to already-published release $tag (id $id) and backfill missing assets"
          fi

      - name: Download build artifacts
        if: steps.find.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p artifacts
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${{ github.repository }}" \
            --dir artifacts
          echo "::group::Downloaded layout"
          find artifacts -maxdepth 3 -type f -exec ls -la {} \;
          echo "::endgroup::"

      - name: Stage with friendly names
        if: steps.find.outputs.skip != 'true'
        run: |
          set -eu
          mkdir -p staged
          # 每个 artifact 是 artifacts/ 下一个子目录；把它的文件按 artifact 名重命名后落入 staged/。
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -maxdepth 1 -type f | wc -l | tr -d ' ')
            for f in "$dir"*; do
              [ -f "$f" ] || continue
              ext="${f##*.}"
              if [ "$count" = "1" ]; then
                cp "$f" "staged/${name}.${ext}"
              else
                cp "$f" "staged/${name}-$(basename "$f")"
              fi
            done
          done
          echo "::group::Staged"
          ls -la staged/
          echo "::endgroup::"

      - name: Upload to release
        if: steps.find.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.find.outputs.id }}
        run: |
          set -eu
          # 按 release id 上传：draft 没有可用的 by-tag 端点，gh release upload
          # 走 tags 会 404（见文件头「历史教训 2」）。直接打 assets API。
          upload_url="https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets"
          attached=0
          for f in staged/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            # --clobber 语义：先删同名旧资产，再传新的
            #（GitHub 的 assets API 对同名资产直接 422，不会自动替换）。
            gh api "/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              --jq ".assets[] | select(.name == \"$base\") | .id" \
              | while IFS= read -r asset_id; do
                  [ -n "$asset_id" ] || continue
                  gh api -X DELETE "/repos/${{ github.repository }}/releases/assets/$asset_id" || true
                done
            # --input 用 @- 之外的写法：gh api 的 -f 会把二进制搞坏，必须 --input。
            gh api -X POST "$upload_url?name=$base" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" > /dev/null
            echo "  uploaded $base"
            attached=$((attached + 1))
          done
          echo "::notice::Attached $attached file(s) to ${{ steps.find.outputs.tag }}"

      # 资产齐了才自动 publish。判定的是「用户实际需要什么」，不是「曾经
      # 期望过什么」（见文件头「历史教训 3」）：
      #   - 至少一份 macOS 下载物（dmg / tar.gz / app.zip 三选一）
      #   - 每个 .tar.gz 都要有同名 .minisig（in-app 自更新依赖这一对）
      # 资产清单必须按 id 读：by-tag 端点对 draft 返回 404。
      - name: Auto-publish when asset set is complete
        if: steps.find.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
          RELEASE_ID: ${{ steps.find.outputs.id }}
        run: |
          set -eu
          meta=$(gh api "/repos/${{ github.repository }}/releases/${RELEASE_ID}")
          is_draft=$(echo "$meta" | jq -r '.draft')
          have=$(echo "$meta" | jq -r '.assets[].name' | sort -u)
          echo "::group::Current assets on $TAG"
          echo "$have"
          echo "::endgroup::"

          missing=""
          if ! echo "$have" | grep -qE '^Warp-cn-(aarch64|x86_64)\.(dmg|tar\.gz)$|^warp-oss-(aarch64|x86_64)-release-(app\.zip|dmg\.dmg)$'; then
            missing="$missing macos-artifact"
          fi
          while IFS= read -r tgz; do
            [ -n "$tgz" ] || continue
            echo "$have" | grep -qx "${tgz}.minisig" || missing="$missing ${tgz}.minisig"
          done < <(echo "$have" | grep -E '\.tar\.gz$' || true)

          if [ -n "$missing" ]; then
            echo "::notice::Release $TAG still missing:$missing — leaving as-is"
            exit 0
          fi

          if [ "$is_draft" = "true" ]; then
            echo "::notice::Asset set complete on draft $TAG, publishing"
            gh api -X PATCH "/repos/${{ github.repository }}/releases/${RELEASE_ID}" \
              -f draft=false -f make_latest=true > /dev/null
            echo "::notice::Published $TAG"
          else
            echo "::notice::Asset set complete on already-published $TAG — backfilled, nothing to publish"
          fi
